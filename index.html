<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #4a90e2 0%, #0b3d91 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weather-app {
      width: min(420px, 90vw);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      padding: 32px;
      text-align: center;
    }

    .weather-app h1 {
      margin: 0 0 14px;
      font-size: 1.9rem;
      letter-spacing: 0.03em;
    }

    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 26px;
    }

    .search-bar input {
      flex: 1;
      padding: 14px 16px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .search-bar button {
      padding: 14px 22px;
      border: none;
      border-radius: 999px;
      background: #ffd166;
      color: #111;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .search-bar button:hover {
      transform: translateY(-1px);
    }

    .weather-result {
      margin-top: 12px;
      padding: 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .weather-result p {
      margin: 8px 0;
      font-size: 1rem;
      line-height: 1.5;
      color: #eef3ff;
    }

    .temperature {
      font-size: 3rem;
      margin: 8px 0;
      font-weight: 700;
    }

    .weather-details {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .weather-card {
      flex: 1 1 130px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px 16px;
      min-width: 120px;
    }

    .weather-card span {
      display: block;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .weather-card strong {
      display: block;
      margin-top: 6px;
      font-size: 1.1rem;
    }

    .error {
      color: #ffb3b3;
      margin-top: 18px;
    }

    .attribution {
      font-size: 0.8rem;
      opacity: 0.75;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <section class="weather-app">
    <h1>Weather Search</h1>
    <div class="search-bar">
      <input id="cityInput" type="text" placeholder="Enter a city name" />
      <button id="searchButton">Search</button>
    </div>

    <div id="weatherOutput" class="weather-result">
      <p>Search for a city to view a weather summary.</p>
    </div>

    <div class="attribution">Static data demonstration only; replace with a live API for real weather.</div>
  </section>

  <script>
    const cityInput = document.getElementById('cityInput');
    const searchButton = document.getElementById('searchButton');
    const weatherOutput = document.getElementById('weatherOutput');

    function renderWeather(data) {
      weatherOutput.innerHTML = `
        <p><strong>${data.city}, ${data.country}</strong></p>
        <div class="temperature">${data.temperature}&deg;C</div>
        <p>${data.description}</p>
        <div class="weather-details">
          <div class="weather-card">
            <span>Humidity</span>
            <strong>${data.humidity}%</strong>
          </div>
          <div class="weather-card">
            <span>Wind</span>
            <strong>${data.wind} km/h</strong>
          </div>
          <div class="weather-card">
            <span>Clouds</span>
            <strong>${data.clouds}%</strong>
          </div>
        </div>
      `;
    }

    function renderMessage(message, isError = false) {
      weatherOutput.innerHTML = `<p class="${isError ? 'error' : ''}">${message}</p>`;
    }

    function getWeatherForCity(city) {
      const normalizedCity = city.trim().toLowerCase();
      const sampleWeather = {
        seattle: { city: 'Seattle', country: 'US', temperature: 14, description: 'Foggy with light showers', humidity: 84, wind: 16, clouds: 92 },
        tokyo: { city: 'Tokyo', country: 'JP', temperature: 22, description: 'Warm and partly cloudy', humidity: 68, wind: 9, clouds: 36 },
        paris: { city: 'Paris', country: 'FR', temperature: 18, description: 'Mild with a gentle breeze', humidity: 72, wind: 11, clouds: 18 },
        cairo: { city: 'Cairo', country: 'EG', temperature: 31, description: 'Hot and sunny', humidity: 24, wind: 7, clouds: 6 },
      };

      return sampleWeather[normalizedCity] || null;
    }

    function searchWeather() {
      const city = cityInput.value;
      if (!city.trim()) {
        renderMessage('Please enter a city name to search.', true);
        return;
      }

      const weather = getWeatherForCity(city);
      if (!weather) {
        renderMessage('City not found in this demo. Try Seattle, Tokyo, Paris, or Cairo.', true);
        return;
      }

      renderWeather(weather);
    }

    searchButton.addEventListener('click', searchWeather);
    cityInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        searchWeather();
      }
    });
  </script>
</body>
</html>
